name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Run installed synthetic demo
        run: myelin-fc-demo --all-models --out out/ci-demo
        env:
          OPENBLAS_NUM_THREADS: "1"
      - name: Upload synthetic demo summary
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-${{ matrix.python-version }}
          path: |
            out/ci-demo/summary.csv
            out/ci-demo/benchmark/summary.csv
            out/ci-demo/DEMO_REPORT.md
          retention-days: 7
